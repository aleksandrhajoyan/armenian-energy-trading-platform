[project]
name = "energy-trading"
version = "0.1.0"
description = "Decision-support platform for participation in Armenia's electricity Day-Ahead Market."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1,<2",
    "fastapi",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3,<4",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2,<3",
    "tzdata>=2026.3",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/energy_trading"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # import ordering
    "B",  # common bug risks (flake8-bugbear)
    "UP", # modern Python upgrade rules
]

[tool.ruff.lint.isort]
known-first-party = ["energy_trading"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
