# On-demand local TimescaleDB for persistence integration.
# Start: docker compose --profile postgres up -d timescaledb
# Stop:  docker compose --profile postgres down
#
# This file does not containerize the API. Only the postgres profile is defined.

services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg17
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${ENERGY_DB_DATABASE:?ENERGY_DB_DATABASE is required}
      POSTGRES_USER: ${ENERGY_DB_USERNAME:?ENERGY_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${ENERGY_DB_PASSWORD:?ENERGY_DB_PASSWORD is required}
    ports:
      - target: 5432
        published: ${ENERGY_DB_PORT:?ENERGY_DB_PORT is required}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  timescale-data:
