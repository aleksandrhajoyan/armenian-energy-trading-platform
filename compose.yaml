# On-demand local TimescaleDB, Redis, Qdrant, and n8n for infrastructure integration.
# TimescaleDB start: docker compose --profile postgres up -d timescaledb
# Redis start:       docker compose --profile redis up -d redis
# Redis stop:        docker compose --profile redis stop redis
# Redis remove:      docker compose --profile redis rm -f redis
# Qdrant start:      docker compose --profile qdrant up -d qdrant
# Qdrant stop:       docker compose --profile qdrant stop qdrant
# n8n start:         docker compose --profile n8n up -d n8n
# n8n stop:          docker compose --profile n8n stop n8n
#
# Profiles are independent. This file does not containerize the API.
# Local Qdrant publishes REST only on 127.0.0.1 and requires QDRANT_API_KEY.
# That is local development/test infrastructure, not production Qdrant security.
# Local n8n publishes HTTP only on 127.0.0.1 and requires N8N_ENCRYPTION_KEY.
# That is local development/test infrastructure, not production n8n security.
# Production requires appropriately secured networking/TLS.

services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg17
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${ENERGY_DB_DATABASE:?ENERGY_DB_DATABASE is required}
      POSTGRES_USER: ${ENERGY_DB_USERNAME:?ENERGY_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${ENERGY_DB_PASSWORD:?ENERGY_DB_PASSWORD is required}
    ports:
      - target: 5432
        published: ${ENERGY_DB_PORT:?ENERGY_DB_PORT is required}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:8.2.9-alpine
    profiles:
      - redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -c
      - redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"
    ports:
      - target: 6379
        published: ${REDIS_PORT:?REDIS_PORT is required}
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    profiles:
      - qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - target: 6333
        published: ${QDRANT_PORT:-6333}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - qdrant-data:/qdrant/storage

  n8n:
    image: n8nio/n8n:2.37.10
    profiles:
      - n8n
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - target: 5678
        published: ${N8N_HOST_PORT:-5678}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  timescale-data:
  qdrant-data:
  n8n-data:
